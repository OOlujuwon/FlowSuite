{% extends "clientflow/layout.html" %}

{% block title %}
    {% if customer %}
        Edit Customer — ClientFlow
    {% else %}
        New Customer — ClientFlow
    {% endif %}
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card">

            <div class="card-body p-4">

                <h2 class="h4 mb-4">

                    {% if customer %}
                        Edit customer
                    {% else %}
                        Add customer
                    {% endif %}

                </h2>


                <form
                    method="post"
                    action="{% if customer %}/clientflow/customers/{{ customer.id }}/edit{% else %}/clientflow/customers/new{% endif %}"
                >

                    <div class="row g-3">

                        <div class="col-md-6">

                            <label class="form-label">
                                Name *
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                required
                                value="{{ customer.name if customer else '' }}"
                            >

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Company
                            </label>

                            <input
                                type="text"
                                name="company"
                                class="form-control"
                                value="{{ customer.company if customer and customer.company else '' }}"
                            >

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                value="{{ customer.email if customer and customer.email else '' }}"
                            >

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Phone
                            </label>

                            <input
                                type="text"
                                name="phone"
                                class="form-control"
                                value="{{ customer.phone if customer and customer.phone else '' }}"
                            >

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Status
                            </label>

                            <select
                                name="status"
                                class="form-select"
                            >

                                {% for item in statuses %}

                                    <option
                                        value="{{ item }}"
                                        {% if customer and customer.status == item %}
                                            selected
                                        {% elif not customer and item == "lead" %}
                                            selected
                                        {% endif %}
                                    >
                                        {{ item|capitalize }}
                                    </option>

                                {% endfor %}

                            </select>

                        </div>


                        <div class="col-12">

                            <label class="form-label">
                                Notes
                            </label>

                            <textarea
                                name="notes"
                                rows="5"
                                class="form-control"
                            >{{ customer.notes if customer and customer.notes else '' }}</textarea>

                        </div>


                        <div class="col-12 d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-dark"
                            >
                                {% if customer %}
                                    Save changes
                                {% else %}
                                    Create customer
                                {% endif %}
                            </button>

                            <a
                                href="/clientflow/customers"
                                class="btn btn-outline-secondary"
                            >
                                Cancel
                            </a>

                        </div>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
